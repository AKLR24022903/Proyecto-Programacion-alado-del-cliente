<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Registro de la persona Usuaria</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
</style>
</head>

<body>
    
    <form>
        <h1>Registro de la persona usuaria</h1>
        <div id="datos">
            <h2>Ingrese datos</h2>
            <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" />
             <!--Nombre-->

               
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" />
                <!--Apellido-->
               
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" />
                <!--Correo-->

               
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" />
                <!--Contraseña-->
        </div>
        <div id="descripcion">
            <h2> Introduzca una breve descripción</h2>
            <label id="descripcion"> Descripción</label>
            <textarea id="descripcion" name="descripcion"></textarea>
        </div>
        <div id="interes">
            <h2>Selecciona interés</h2>

            <label for="Tecnología">Tecnología:</label>
            <input type="checkbox" checked id="Tecnología">
            <label for="Arte">Arte:</label>
            <input type="checkbox" checked id="Arte">
            <label for="Deporte">Deporte:</label>
            <input type="checkbox" checked id="Deporte">
            <label for="Cocina">Cocina:</label>
            <input type="checkbox" checked id="Cocina">
        </div>
        <div id="diapreferente">
            <h2>Escoje un día de preferencia</h2>
            <label for="martes">Martes</label>
            <input type="radio" name="diapreferente" id="martes"  value="Martes">

            <label for="miercoles">Miercoles</label>
            <input type="radio" name="diapreferente" id="miercoles" value="Miercoles">

            <label for="jueves">Jueves</label>
            <input type="radio" name="diapreferente" id="jueves" value="Jueves">
        </div>
        <div id="boton">
            <input type="submit" value="Registrarse"/>

        </div>

    </form>
</body>

</html>
